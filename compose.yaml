services:
    mongodb:
        image: mongo:7.0.1
        container_name: mongodb
        ports:
            - "${MONGO_PORT}:27017"
        env_file:
            - .env
        volumes:
            - mongo_data:/data/db
            - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
        restart: unless-stopped

volumes:
    mongo_data:
