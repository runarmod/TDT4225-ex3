[project]
name = "tdt4225-ex3"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Runar Saur Modahl", email = "runarsm@ntnu.no" },
    { name = "Martin Sandaker Reve", email = "martirev@ntnu.no" },
    { name = "Morten Madsen Lyngstad", email = "morteml@ntnu.no" },
]
requires-python = ">=3.14"
dependencies = [
    "haversine>=2.9.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "tabulate>=0.10.0",
]

[project.scripts]
example = "tdt4225_ex3.example:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.7.0", "ruff>=0.17.0"]
