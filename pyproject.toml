[project]
name = "tdt4225-ex3"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Runar Saur Modahl", email = "runarsm@ntnu.no" },
    { name = "Martin Sandaker Reve", email = "martirev@ntnu.no" },
    { name = "Morten Madsen Lyngstad", email = "morteml@ntnu.no" },
]
requires-python = ">=3.14"
dependencies = [
    "haversine>=2.9.0",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.4",
    "tabulate>=0.10.0",
]

[project.scripts]
insert = "tdt4225_ex3.insert_data:main"
queries = "tdt4225_ex3.queries:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pandas>=3.1.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]
